services:
  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  backend:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  database:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
